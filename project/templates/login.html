{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="card card-small">

    <div class="logo">
        LibraSystem®
        <span class="logo-dot"></span>
    </div>

    <p class="subtitle">
        Sign in to your account
    </p>


    <form method="POST">

        <div class="field">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

        </div>

        <div class="field">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>

        <div class="field">

            <label for="user_id">
                User ID
            </label>

            <input
                type="user_id"
                id="user_id"
                name="user_id"
                placeholder="Enter your User ID"
                required
            >

        </div>

        <button class="btn" type="submit">
            Login
        </button>

    </form>

    <div class="footer-link">

        Don't have an account?
        <a href="{{ url_for('auth.register') }}">
            Register
        </a>

    </div>

</div>

{% endblock %}
