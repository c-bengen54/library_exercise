{% extends "base.html" %}

{% block title %}
Add Book
{% endblock %}

{% block content %}
<div class="card card-small">
    <div class="logo">
        LibraSystem®
        <span class="logo-dot"></span>
    </div>

    <p class="subtitle">Add a new book</p>

    <form method="POST">

        <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter book title" required>
        </div>

        <div class="field">
            <label for="author">Author</label>
            <input type="text" id="author" name="author" placeholder="Enter author name" required>
        </div>

        <div class="field">
            <label for="publication">Publication Year</label>
            <input type="number" id="publication" name="publication" placeholder="e.g. 1998" required>
        </div>

        <div class="field">
            <label for="genre">Genre</label>
            <input type="text" id="genre" name="genre" placeholder="Enter genre" required>
        </div>

        <div class="field">
            <label for="isbn">ISBN</label>
            <input type="text" id="isbn" name="isbn" placeholder="Enter ISBN" required>
        </div>

        <button class="btn" type="submit">Add Book</button>

    </form>

    <span class="footer-link"><a href="{{ url_for('admin.dashboard') }}">← Back to Dashboard</a></span>
</div>
{% endblock %}
