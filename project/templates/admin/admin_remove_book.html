{% extends "base.html" %}

{% block title %}
Remove Book
{% endblock %}

{% block content %}
<div class="card card-small">
    <div class="logo">
        LibraSystem®
        <span class="logo-dot"></span>
    </div>

    <h1 class="dash-header">{{ book[1] }}</h1>

    <div class="profile-row">
        <span class="key">Author</span>
        <span class="val">{{ book[2] }}</span>
    </div>

    <div class="profile-row">
        <span class="key">Publication</span>
        <span class="val">{{ book[3] }}</span>
    </div>

    <div class="profile-row">
        <span class="key">ISBN</span>
        <span class="val">{{ book[5] }}</span>
    </div>

    <p class="subtitle">Are you sure you want to permanently remove this book?</p>

    <form method="POST">
        <button class="btn" type="submit">Confirm Remove</button>
    </form>

    <span class="footer-link"><a href="{{ url_for('admin.dashboard') }}">Cancel</a></span>
</div>
{% endblock %}
